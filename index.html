<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photobooth</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131316;
    --panel: #1d1d22;
    --text: #f4f4f6;
    --muted: #9a9aa5;
    --bulb: #ffcf3f;
    --bulb-ink: #1a1400;
    --stage-h: calc(100dvh - 190px);   /* height reserved for the preview, whatever its shape */
    --font: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    overflow: hidden;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #app {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 16px;
  }
  .hidden { display: none !important; }

  /* ---------- Camera stage ---------- */
  #stageArea {
    width: 100%; height: var(--stage-h);
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    position: relative;
    --ar: 1.3333;                      /* set from the selected frame's photo window */
    aspect-ratio: var(--ar);
    width: min(100%, calc(var(--stage-h) * var(--ar)));
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 0 6px var(--panel), 0 0 0 8px #2c2c33;
  }
  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }
  #video.mirror { transform: scaleX(-1); }
  #freeze {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
  }

  #countdown {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: min(45vh, 45vw);
    color: #fff;
    text-shadow: 0 6px 40px rgba(0,0,0,.65), 0 0 6px rgba(0,0,0,.5);
    pointer-events: none;
  }
  #countdown.tick span { animation: pop 1s ease-out forwards; }
  @keyframes pop {
    0%   { transform: scale(1.5); opacity: 0; }
    15%  { transform: scale(1);   opacity: 1; }
    80%  { transform: scale(.92); opacity: 1; }
    100% { transform: scale(.85); opacity: 0; }
  }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash 3s ease-out; }   /* fades out over the whole 3s freeze */
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  #status {
    position: absolute; left: 14px; top: 12px;
    background: rgba(0,0,0,.5); padding: 6px 12px; border-radius: 999px;
    font-size: 15px; font-weight: 500;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #message {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 18px; line-height: 1.4; color: var(--muted);
    background: #000;
  }
  #message b { color: var(--text); }

  /* ---------- Controls ---------- */
  #controls { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px 14px; }
  #shots { display: flex; gap: 8px; }
  #shots i {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #4a4a55; background: transparent; transition: all .2s;
  }
  #shots i.done { background: var(--bulb); border-color: var(--bulb); }
  #shots i.off { visibility: hidden; }   /* keeps its space so nothing shifts */

  button {
    font-family: var(--font); font-weight: 800; font-size: 20px;
    border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer;
    background: var(--bulb); color: var(--bulb-ink);
    transition: transform .08s, opacity .2s;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button.secondary { background: var(--panel); color: var(--text); font-weight: 500; font-size: 17px; padding: 14px 24px; border: 1px solid #34343c; }
  #flip { padding: 14px 18px; }
  #frameBtn { width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* photos-per-strip toggle */
  #layoutSeg { display: flex; background: var(--panel); border: 1px solid #34343c; border-radius: 999px; padding: 4px; }
  #layoutSeg button {
    background: transparent; color: var(--muted); font-weight: 500; font-size: 16px; padding: 10px 16px; border-radius: 999px;
  }
  #layoutSeg button.on { background: var(--bulb); color: var(--bulb-ink); font-weight: 800; }

  /* ---------- Frame picker ---------- */
  #frameModal {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #framePanel {
    background: var(--panel); border: 1px solid #34343c; border-radius: 24px;
    padding: 22px 22px 20px; max-width: 100%; display: flex; flex-direction: column; gap: 16px; align-items: center;
  }
  #framePanel h2 { margin: 0; font-size: 22px; font-weight: 800; }
  #frameList {
    display: flex; gap: 14px; overflow-x: auto; max-width: calc(100vw - 80px);
    padding: 6px; -webkit-overflow-scrolling: touch;
  }
  .frameItem {
    flex: 0 0 auto; background: transparent; color: var(--text); font-weight: 500; font-size: 15px;
    padding: 8px; border-radius: 14px; border: 3px solid transparent;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .frameItem canvas { width: 90px; height: auto; border-radius: 3px; background: #000; display: block; }
  .frameItem.selected { border-color: var(--bulb); }

  /* ---------- Result ---------- */
  #result { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; gap: 32px; flex-wrap: wrap; }
  #resultImg {
    height: min(calc(100dvh - 40px), 90vw * 1.48);
    aspect-ratio: 100 / 148;
    border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    -webkit-user-select: auto; user-select: auto;
    -webkit-touch-callout: default;
  }
  #resultSide { display: flex; flex-direction: column; gap: 12px; align-items: stretch; min-width: 220px; }
  #resultSide p { margin: 0 0 6px; color: var(--muted); font-size: 15px; line-height: 1.4; max-width: 240px; }
  @media (max-aspect-ratio: 1/1) {
    #result { flex-direction: column; gap: 16px; }
    #resultImg { height: min(65dvh, 90vw * 1.48); }
    #resultSide { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    #resultSide p { display: none; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- Booth -->
  <div id="booth" style="display:contents">
    <div id="stageArea">
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <img id="freeze" class="hidden" alt="">
      <div id="countdown"></div>
      <div id="flash"></div>
      <div id="status" class="hidden"></div>
      <div id="message">Starting camera…<br>Tap <b>Allow</b> when Safari asks for access.</div>
    </div>
    </div>
    <div id="controls">
      <button id="flip" class="secondary" aria-label="Switch camera" title="Switch camera">Flip</button>
      <div id="layoutSeg" role="group" aria-label="Photos per strip">
        <button data-n="3">3 photos</button>
        <button data-n="4">4 photos</button>
      </div>
      <button id="frameBtn" class="secondary hidden">Frame</button>
      <button id="start" disabled>Start photos</button>
      <div id="shots" aria-hidden="true"></div>
    </div>
  </div>

  <!-- Result -->
  <div id="result" class="hidden">
    <img id="resultImg" alt="Your photo strips">
    <div id="resultSide">
      <p>Press and hold the picture to save it to Photos, or use the buttons below.</p>
      <button id="printBtn">Print</button>
      <button id="resultFrameBtn" class="secondary hidden">Change frame</button>
      <button id="shareBtn" class="secondary">Save / Share</button>
      <a id="downloadLink" class="hidden" download="photobooth.jpg"></a>
      <button id="againBtn" class="secondary">Take new photos</button>
    </div>
  </div>
</div>

<!-- Frame chooser -->
<div id="frameModal" class="hidden" role="dialog" aria-modal="true" aria-label="Choose a frame">
  <div id="framePanel">
    <h2>Choose a frame</h2>
    <div id="frameList"></div>
    <button id="frameClose" class="secondary">Close</button>
  </div>
</div>

<script>
(() => {
  // ---------- Settings ----------
  const COUNT_FROM   = 5;      // seconds in the countdown
  const REVIEW_MS    = 3000;   // how long each new photo stays frozen on screen
  const CAPTION_TEXT = '';     // optional text under the photos on each strip (built-in black frame only)
  const DEFAULT_SHOTS = 4;     // 3 or 4 photos per strip when the page first opens

  // Paper used for the Print button's PDF. The whole sheet is built at this paper's exact shape.
  //   'selphy' = Canon SELPHY postcard paper, 100 x 148 mm (iOS lists it as "Postcard")
  //   '4x6'    = true 4 x 6 in, 101.6 x 152.4 mm (most other photo printers)
  const PRINT_PAPER = 'selphy';
  const PAPERS = { selphy: { w: 100, h: 148 }, '4x6': { w: 101.6, h: 152.4 } };

  // ---------- Sheet + strip geometry ----------
  // The sheet holds two identical strips side by side. Each strip is half the paper wide and
  // the full paper tall: 50 x 148 mm on SELPHY paper.
  const PAPER   = PAPERS[PRINT_PAPER] || PAPERS['4x6'];
  const SHEET_W = 1200;                                         // px
  const SHEET_H = Math.round(SHEET_W * PAPER.h / PAPER.w);      // 1776 (SELPHY) or 1800 (4x6)
  const STRIP_W = SHEET_W / 2;                                  // 600
  const STRIP_H = SHEET_H;

  // Photo windows for each layout, in strip pixels (600 wide), modelled on the reference strips.
  //   3 photos: 520x425 photos (same left/right/top margins as 4 photos), big empty area underneath for a caption/logo
  //   4 photos: 520x347 (3:2) photos with a smaller area underneath
  const stack = (n, x, top, w, h, gap) =>
    Array.from({ length: n }, (_, i) => ({ x, y: top + i * (h + gap), w, h }));
  const LAYOUTS = {
    3: stack(3, 40,  60, 520, 425, 24),
    4: stack(4, 40,  60, 520, 347, 24),
  };

  const CAPTURE_W = 1080, CAPTURE_H = 810;   // stored photo size (4:3), cropped again per window

  // ---------- Frames ----------
  // Custom frames are images stored in the repo, one per layout (3 and 4 photos), because the
  // photo windows are in different places. Make each image 600 x 1776 px (or 600 x 1800 if you
  // set PRINT_PAPER to '4x6'). It is the size of ONE strip.
  //   • .png → drawn ON TOP of the photos, so leave the photo windows transparent.
  //   • .jpg → drawn BEHIND the photos, which sit in the windows listed in LAYOUTS above.
  // Give a frame just one of the two files and it only appears for that layout.
  // Optional per-frame settings:
  //   overlay: true/false – override the png/jpg rule above
  //   slots:   { 3: [{x,y,w,h},…3], 4: [{x,y,w,h},…4] } – your own photo windows
  // A file that can't be loaded is skipped automatically.
  const FRAME_CONFIG = [
    { id: 'black',  name: 'Classic Black' },                       // built in, no file needed
    { id: 'white',  name: 'Classic White', files: { 3: 'frames/white-3.png',  4: 'frames/white-4.png'  } },
    { id: 'film',   name: 'Film Strip',    files: { 3: 'frames/film-3.png',   4: 'frames/film-4.png'   } },
    { id: 'sunset', name: 'Sunset',        files: { 3: 'frames/sunset-3.jpg', 4: 'frames/sunset-4.jpg' } },
    // { id: 'party', name: 'Party', files: { 3: 'frames/party-3.png', 4: 'frames/party-4.png' } },
  ];

  // ---------- Elements ----------
  const $ = id => document.getElementById(id);
  const video = $('video'), startBtn = $('start'), flipBtn = $('flip');
  const countdownEl = $('countdown'), flashEl = $('flash'), statusEl = $('status'), messageEl = $('message');
  const shotsEl = $('shots'), segBtns = [...document.querySelectorAll('#layoutSeg button')];
  const booth = $('booth'), result = $('result');
  const resultImg = $('resultImg'), freezeEl = $('freeze');
  const frameBtn = $('frameBtn'), resultFrameBtn = $('resultFrameBtn');
  const frameModal = $('frameModal'), frameList = $('frameList');
  const dots = () => [...shotsEl.querySelectorAll('i')].slice(0, shots);   // the dots in use

  let stream = null, facing = 'user', busy = false;
  let shots = DEFAULT_SHOTS;
  let frames = [FRAME_CONFIG[0]], selected = frames[0];
  let lastPhotos = null, renderId = 0;
  let finalBlob = null, finalUrl = null, pdfFile = null, pdfUrl = null;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // ---------- Camera ----------
  async function startCamera() {
    stopCamera();
    startBtn.disabled = true;
    messageEl.classList.remove('hidden');
    messageEl.innerHTML = 'Starting camera…<br>Tap <b>Allow</b> when Safari asks for access.';

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      messageEl.innerHTML = 'This browser can’t access the camera.<br>Open this page in <b>Safari</b> over <b>https://</b>.';
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = stream;
      video.classList.toggle('mirror', facing === 'user');
      await video.play();
      messageEl.classList.add('hidden');
      startBtn.disabled = false;
    } catch (err) {
      console.error(err);
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      messageEl.innerHTML = denied
        ? 'Camera access is blocked.<br>Go to <b>Settings › Safari › Camera</b>, choose <b>Ask</b> or <b>Allow</b>, then reload this page.'
        : 'Couldn’t start the camera.<br>' + (err && err.message ? err.message : 'Please reload and try again.');
    }
  }
  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  // ---------- Capture ----------
  // Grab the current video frame, center-cropped to 4:3, mirrored if front camera.
  function grabFrame() {
    const vw = video.videoWidth, vh = video.videoHeight;
    const target = CAPTURE_W / CAPTURE_H;
    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (vw / vh > target) { sw = vh * target; sx = (vw - sw) / 2; }
    else                  { sh = vw / target; sy = (vh - sh) / 2; }

    const c = document.createElement('canvas');
    c.width = CAPTURE_W; c.height = CAPTURE_H;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    if (facing === 'user') { ctx.translate(CAPTURE_W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, CAPTURE_W, CAPTURE_H);
    return c;
  }

  async function countdown(n) {
    for (let i = n; i >= 1; i--) {
      countdownEl.classList.remove('tick');
      countdownEl.innerHTML = '<span>' + i + '</span>';
      void countdownEl.offsetWidth;            // restart animation
      countdownEl.classList.add('tick');
      await sleep(1000);
    }
    countdownEl.classList.remove('tick');
    countdownEl.innerHTML = '';
  }

  // Shutter sound, synthesized with Web Audio (no audio file needed). iOS only allows audio after
  // a tap, so the context is created/resumed when "Start photos" is pressed.
  let audioCtx = null;
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function playShutter() {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    const click = (t, dur, freq, vol) => {
      const n = Math.floor(audioCtx.sampleRate * dur);
      const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 0.8;
      const g = audioCtx.createGain(); g.gain.value = vol;
      src.connect(bp); bp.connect(g); g.connect(audioCtx.destination);
      src.start(t);
    };
    const thump = (t, f0, f1, vol) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.06);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.08);
    };
    click(t0, 0.045, 3200, 1.1);  thump(t0, 220, 90, 0.5);          // shutter opens
    click(t0 + 0.085, 0.07, 2000, 0.9); thump(t0 + 0.085, 160, 70, 0.4);   // shutter closes
  }

  function flash() {
    flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
  }
  // Clear the class when the fade ends so the animation can't replay when the booth is shown again.
  flashEl.addEventListener('animationend', () => flashEl.classList.remove('go'));

  function setBusy(b) {
    busy = b;
    startBtn.disabled = b; flipBtn.disabled = b; frameBtn.disabled = b;
    segBtns.forEach(x => x.disabled = b);
  }

  async function runSession() {
    if (busy) return;
    unlockAudio();
    setBusy(true);
    const total = shots;
    dots().forEach(d => d.classList.remove('done'));
    statusEl.classList.remove('hidden');

    const photos = [];
    for (let i = 0; i < total; i++) {
      statusEl.textContent = 'Photo ' + (i + 1) + ' of ' + total;
      await countdown(COUNT_FROM);
      const frame = grabFrame();
      photos.push(frame);
      freezeEl.src = frame.toDataURL('image/jpeg', 0.9);
      freezeEl.classList.remove('hidden');   // freeze on the photo just taken
      flash();
      playShutter();
      dots()[i].classList.add('done');
      await sleep(REVIEW_MS);
      freezeEl.classList.add('hidden');
    }
    statusEl.classList.add('hidden');
    lastPhotos = photos;
    flashEl.classList.remove('go');
    await renderResult();
    booth.classList.add('hidden');
    result.classList.remove('hidden');
    setBusy(false);
    startBtn.disabled = !stream;
  }

  // ---------- Photos-per-strip toggle ----------
  function setShots(n) {
    shots = n;
    store.set('photobooth-shots', String(n));
    segBtns.forEach(b => b.classList.toggle('on', Number(b.dataset.n) === n));
    shotsEl.innerHTML = '<i></i><i></i><i></i><i></i>';        // always 4 so the row never shifts
    shotsEl.lastElementChild.classList.toggle('off', n < 4);   // 4th dot appears at the far right
    updateFrameUI();
  }
  segBtns.forEach(b => b.addEventListener('click', () => { if (!busy) setShots(Number(b.dataset.n)); }));

  // ---------- Compose ----------
  // Draw photo `img` into box (x,y,w,h) using "cover" cropping.
  function drawCover(ctx, img, x, y, w, h) {
    const iw = img.width, ih = img.height;
    const ar = w / h;
    let sx = 0, sy = 0, sw = iw, sh = ih;
    if (iw / ih > ar) { sw = ih * ar; sx = (iw - sw) / 2; }
    else              { sh = iw / ar; sy = (ih - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  // Frames that can be used with a given photo count.
  const availableFrames = n => frames.filter(f => !f.files || (f.art && f.art[n]));
  // The selected frame, or the built-in black one if it has no art for this layout.
  const frameFor = n => availableFrames(n).includes(selected) ? selected : frames[0];

  // Draw one strip at horizontal offset x0. photos === null draws grey placeholders.
  function drawStrip(ctx, x0, photos, frame, count) {
    const slots = (frame.slots && frame.slots[count]) || LAYOUTS[count];
    const art = frame.art && frame.art[count];
    ctx.fillStyle = '#000';
    ctx.fillRect(x0, 0, STRIP_W, STRIP_H);
    if (art && !art.overlay) ctx.drawImage(art.img, x0, 0, STRIP_W, STRIP_H);     // background art
    slots.forEach((s, i) => {
      if (photos && photos[i]) drawCover(ctx, photos[i], x0 + s.x, s.y, s.w, s.h);
      else { ctx.fillStyle = '#6b7280'; ctx.fillRect(x0 + s.x, s.y, s.w, s.h); }
    });
    if (art && art.overlay) ctx.drawImage(art.img, x0, 0, STRIP_W, STRIP_H);      // overlay art
    if (!art && CAPTION_TEXT && photos) {
      const last = slots[slots.length - 1];
      const yCap = last.y + last.h + (STRIP_H - last.y - last.h) / 2;
      ctx.fillStyle = '#fff';
      ctx.font = '600 28px -apple-system, Helvetica, Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(CAPTION_TEXT, x0 + STRIP_W / 2, yCap);
    }
  }

  // Full sheet = two identical strips side by side.
  function composeSheet(photos, frame) {
    const sheet = document.createElement('canvas');
    sheet.width = SHEET_W; sheet.height = SHEET_H;
    const ctx = sheet.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    drawStrip(ctx, 0, photos, frame, photos.length);
    drawStrip(ctx, STRIP_W, photos, frame, photos.length);
    ctx.fillStyle = '#2a2a2a';                      // faint cut guide
    ctx.fillRect(STRIP_W - 1, 0, 2, SHEET_H);
    return sheet;
  }

  // Build the sheet from lastPhotos + the chosen frame, and refresh the image and PDF.
  async function renderResult() {
    const id = ++renderId;
    const sheet = composeSheet(lastPhotos, frameFor(lastPhotos.length));
    const blob = await new Promise(res => sheet.toBlob(res, 'image/jpeg', 0.95));
    const pdf = new File([await makePdf(blob)], 'photobooth-print.pdf', { type: 'application/pdf' });
    if (id !== renderId) return;                    // a newer render superseded this one

    if (finalUrl) URL.revokeObjectURL(finalUrl);
    if (pdfUrl) URL.revokeObjectURL(pdfUrl);
    finalBlob = blob; pdfFile = pdf;
    finalUrl = URL.createObjectURL(blob);
    pdfUrl = URL.createObjectURL(pdf);
    resultImg.src = finalUrl;
    $('downloadLink').href = finalUrl;
  }

  // ---------- Print PDF ----------
  // One-page PDF whose page is exactly the chosen paper size. The sheet is built at the same
  // shape, so it fills the page edge to edge with nothing trimmed. iOS prints PDFs at their true
  // page size, with no URL/date footer.
  async function makePdf(jpegBlob) {
    const jpg = new Uint8Array(await jpegBlob.arrayBuffer());
    const pw = PAPER.w / 25.4 * 72, ph = PAPER.h / 25.4 * 72;          // page size in points
    const sc = Math.max(pw / SHEET_W, ph / SHEET_H);                     // "cover" scale
    const iw = SHEET_W * sc, ih = SHEET_H * sc;
    const ix = (pw - iw) / 2, iy = (ph - ih) / 2;
    const f = n => n.toFixed(3);
    const enc = new TextEncoder();
    const chunks = [], offsets = [];
    let len = 0;
    const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; };
    const obj = (n, body) => { offsets[n] = len; push(n + ' 0 obj\n' + body + '\nendobj\n'); };

    push('%PDF-1.4\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + f(pw) + ' ' + f(ph) + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
    offsets[4] = len;
    push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + SHEET_W + ' /Height ' + SHEET_H +
         ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');
    push(jpg);
    push('\nendstream\nendobj\n');
    const content = 'q ' + f(iw) + ' 0 0 ' + f(ih) + ' ' + f(ix) + ' ' + f(iy) + ' cm /Im0 Do Q';
    obj(5, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');

    const xrefPos = len;
    let x = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    push(x + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF');
    return new Blob(chunks, { type: 'application/pdf' });
  }

  // ---------- Frame picker ----------
  function loadImage(src) {
    return new Promise(res => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => { console.warn('Frame image not found, skipping:', src); res(null); };
      im.src = src;
    });
  }

  async function loadFrames() {
    const list = await Promise.all(FRAME_CONFIG.map(async f => {
      if (!f.files) return f;
      const art = {};
      for (const n of [3, 4]) {
        const src = f.files[n];
        if (!src) continue;
        const img = await loadImage(src);
        if (img) art[n] = { img, overlay: f.overlay !== undefined ? f.overlay : /\.png$/i.test(src.split('?')[0]) };
      }
      return { ...f, art };
    }));
    return list.filter(f => !f.files || Object.keys(f.art).length);
  }

  function makeThumb(frame, count) {
    const c = document.createElement('canvas');
    c.width = 180; c.height = Math.round(180 * STRIP_H / STRIP_W);
    const ctx = c.getContext('2d');
    ctx.scale(180 / STRIP_W, 180 / STRIP_W);
    drawStrip(ctx, 0, null, frame, count);
    return c;
  }

  const currentCount = () => (!result.classList.contains('hidden') && lastPhotos) ? lastPhotos.length : shots;

  // Make the live preview the same shape as the photo windows of the selected frame / layout.
  function applyPreviewAspect() {
    const slots = (frameFor(shots).slots && frameFor(shots).slots[shots]) || LAYOUTS[shots];
    $('stage').style.setProperty('--ar', (slots[0].w / slots[0].h).toFixed(4));
  }

  function updateFrameUI() {
    applyPreviewAspect();
    const multi = availableFrames(shots).length > 1;
    frameBtn.classList.toggle('hidden', !multi);
    frameBtn.textContent = 'Frame: ' + frameFor(shots).name;
    const rc = lastPhotos ? lastPhotos.length : shots;
    resultFrameBtn.classList.toggle('hidden', availableFrames(rc).length < 2);
  }

  function openFrameModal() {
    const n = currentCount();
    const active = frameFor(n);
    frameList.innerHTML = '';
    availableFrames(n).forEach(f => {
      const b = document.createElement('button');
      b.className = 'frameItem' + (f === active ? ' selected' : '');
      b.appendChild(makeThumb(f, n));
      const label = document.createElement('span');
      label.textContent = f.name;
      b.appendChild(label);
      b.addEventListener('click', () => chooseFrame(f));
      frameList.appendChild(b);
    });
    frameModal.classList.remove('hidden');
  }
  const closeFrameModal = () => frameModal.classList.add('hidden');

  async function chooseFrame(f) {
    selected = f;
    store.set('photobooth-frame', f.id);
    updateFrameUI();
    closeFrameModal();
    if (!result.classList.contains('hidden') && lastPhotos) await renderResult();   // re-frame current photos
  }

  frameBtn.addEventListener('click', openFrameModal);
  resultFrameBtn.addEventListener('click', openFrameModal);
  $('frameClose').addEventListener('click', closeFrameModal);
  frameModal.addEventListener('click', e => { if (e.target === frameModal) closeFrameModal(); });

  // ---------- Result actions ----------
  $('printBtn').addEventListener('click', () => {
    if (!pdfFile) return;
    if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
      navigator.share({ files: [pdfFile], title: 'Photobooth print' }).catch(() => {});  // pick "Print"
    } else {
      window.open(pdfUrl, '_blank');   // PDF viewer, then Share > Print
    }
  });

  $('shareBtn').addEventListener('click', async () => {
    if (!finalBlob) return;
    const file = new File([finalBlob], 'photobooth.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Photobooth' }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    $('downloadLink').click();   // fallback
  });

  $('againBtn').addEventListener('click', () => {
    flashEl.classList.remove('go');
    freezeEl.classList.add('hidden');
    result.classList.add('hidden');
    booth.classList.remove('hidden');
    dots().forEach(d => d.classList.remove('done'));
    lastPhotos = null;
    updateFrameUI();
    if (!stream) startCamera(); else startBtn.disabled = false;
  });

  // ---------- Wiring ----------
  startBtn.addEventListener('click', runSession);
  flipBtn.addEventListener('click', () => {
    facing = facing === 'user' ? 'environment' : 'user';
    startCamera();
  });

  // Restart the camera if Safari paused it while the tab was in the background
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !busy && !booth.classList.contains('hidden')) {
      const live = stream && stream.getVideoTracks().some(t => t.readyState === 'live');
      if (!live) startCamera();
    }
  });

  const savedShots = Number(store.get('photobooth-shots'));
  setShots(savedShots === 3 || savedShots === 4 ? savedShots : DEFAULT_SHOTS);
  startCamera();
  loadFrames().then(list => {
    frames = list;
    selected = frames.find(f => f.id === store.get('photobooth-frame')) || frames[0];
    updateFrameUI();
  });
})();
</script>
</body>
</html>
