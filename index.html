<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photobooth</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #4F1111;
    --panel: #141414;
    --text: #F2F0EF;
    --muted: #9a9aa5;
    --bulb: #E09120;
    --bulb-ink: #141414;
    --G: clamp(14px, 3.4dvh, 40px);    /* the one gap used above the header, below it, and around the preview */
    --header-h: calc(var(--G) * 2 + 75px);   /* header image + its margins; measured at runtime */
    --controls-h: 116px;               /* height of the button area; measured at runtime */
    --stage-h: calc(100dvh - var(--header-h) - var(--controls-h) - 2 * var(--G));   /* area for the preview + its outline */
    --font: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%; }
  body {
    position: fixed; inset: 0; width: 100%;
    display: flex; flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    overflow: hidden;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  #header {
    flex: 0 0 auto; width: 100%;
    display: flex; justify-content: center; padding: 0 16px; margin: var(--G) 0;   /* transparent: no banner behind the image */
    pointer-events: none;
  }
  #header[hidden] { display: none; }
  #headerImg { position: relative; z-index: 1; display: block; width: min(100%, 680px); aspect-ratio: 1174 / 129; height: auto; }
  #app {
    flex: 1 1 auto; min-height: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: var(--G); padding: 0 16px;
  }
  .hidden { display: none !important; }

  /* ---------- Camera stage ---------- */
  #stageArea {
    width: 100%; height: var(--stage-h);
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    position: relative;
    --ar: 1.3333;                      /* set from the selected frame's photo window */
    aspect-ratio: var(--ar);
    margin: 6px;                                       /* room for the 6px outline inside the area */
    width: min(calc(100% - 12px), calc((var(--stage-h) - 12px) * var(--ar)));
    background: #141414;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 0 6px #F2F0EF;                       /* white outline */
  }
  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #141414;
  }
  #video.mirror { transform: scaleX(-1); }
  #video.bw, #freeze.bw { filter: grayscale(1); }   /* B&W mode: live preview + frozen photo */
  #freeze {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #141414;
  }

  #countdown {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: min(45vh, 45vw);
    color: #F2F0EF;
    text-shadow: 0 6px 40px rgba(0,0,0,.65), 0 0 6px rgba(0,0,0,.5);
    pointer-events: none;
  }
  #countdown.tick span { animation: pop 1s ease-out forwards; }
  @keyframes pop {
    0%   { transform: scale(1.5); opacity: 0; }
    15%  { transform: scale(1);   opacity: 1; }
    80%  { transform: scale(.92); opacity: 1; }
    100% { transform: scale(.85); opacity: 0; }
  }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash 3s ease-out; }   /* fades out over the whole 3s freeze */
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  #status {
    position: absolute; left: 14px; top: 12px;
    background: rgba(0,0,0,.5); padding: 6px 12px; border-radius: 999px;
    font-size: 15px; font-weight: 500;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #message {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; font-size: 18px; line-height: 1.4; color: var(--muted);
    background: #141414;
  }
  #message b { color: var(--text); }

  /* ---------- Controls ---------- */
  #controlsWrap { position: relative; display: flex; justify-content: center; }
  #controls { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  /* While photos are being taken, a cover in the page colour fades in over the whole button area
     (so every old button fades out at once) and carries the red Cancel button. */
  #controlsCover {
    position: absolute; inset: -6px -24px; z-index: 5;
    background: var(--bg); border-radius: 28px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
  }
  body.shooting #controlsCover { opacity: 1; pointer-events: auto; }
  #cancelBtn {
    background: #e5372c; color: #F2F0EF; padding: 18px 64px;
    pointer-events: none;
  }
  body.shooting #cancelBtn { pointer-events: auto; }
  .row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px 14px; }

  button {
    font-family: var(--font); font-weight: 800; font-size: 20px;
    border: 0; border-radius: 999px; padding: 16px 34px; cursor: pointer;
    background: var(--bulb); color: var(--bulb-ink);
    transition: transform .08s, opacity .2s;
  }
  button:active { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: default; }
  button:focus-visible { outline: 3px solid #F2F0EF; outline-offset: 3px; }
  button.secondary { background: #F2F0EF; color: #141414; font-weight: 500; font-size: 17px; padding: 14px 24px; border: 1px solid transparent; }
  #flip { padding: 11px 16px; line-height: 0; }
  #flip img { width: 32px; height: 32px; display: block; filter: brightness(0) invert(.078); }   /* #141414, to show on the light button */
  #frameBtn { width: 300px; white-space: nowrap; }
  #frameBtn b { font-weight: 800; }   /* width is set from the longest frame name at runtime */

  /* option groups: label + choices */
  .opt {
    display: flex; align-items: center; gap: 6px;
    background: #F2F0EF; border: 1px solid transparent; border-radius: 999px; padding: 4px 4px 4px 18px;
  }
  .optLabel { color: #141414; font-size: 16px; font-weight: 800; white-space: nowrap; }
  .optDiv { width: 1px; height: 24px; background: #b9b9c2; margin: 0 8px 0 6px; flex: 0 0 auto; }
  .opt button {
    background: transparent; color: #141414; font-weight: 500; font-size: 16px; padding: 10px 16px; border-radius: 999px;
  }
  .opt button.on { background: var(--bulb); color: var(--bulb-ink); font-weight: 800; }

  /* ---------- Frame picker ---------- */
  #frameModal {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center; padding: 20px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #framePanel {
    background: var(--panel); border: 1px solid #34343c; border-radius: 24px;
    padding: 22px 22px 20px; max-width: 100%; display: flex; flex-direction: column; gap: 16px; align-items: center;
  }
  #framePanel h2 { margin: 0; font-size: 22px; font-weight: 800; }
  #frameList {
    display: flex; gap: 14px; overflow-x: auto; max-width: calc(100vw - 80px);
    padding: 6px; -webkit-overflow-scrolling: touch; touch-action: pan-x; overscroll-behavior: contain;
  }
  .frameItem {
    flex: 0 0 auto; background: transparent; color: var(--text); font-weight: 500; font-size: 15px;
    padding: 8px; border-radius: 14px; border: 3px solid transparent;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .frameItem canvas { width: 90px; height: auto; border-radius: 3px; background: #141414; display: block; }
  .frameItem.selected { border-color: var(--bulb); }

  /* ---------- Print instructions (side panel, stays visible behind the iPad print screen) ---------- */
  :root { --help-w: clamp(150px, 15vw, 200px); }
  #printHelp {
    position: fixed; right: 10px; top: calc(50% + var(--header-h) / 2); transform: translateY(-50%); z-index: 3;
    width: var(--help-w);
    background: var(--panel); border: 1px solid #34343c; border-radius: 16px;
    padding: 14px 12px 12px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #printHelp h3 { margin: 0; font-size: 16px; font-weight: 800; }
  #printHelp ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: step; }
  #printHelp li {
    counter-increment: step; position: relative; padding-left: 30px; min-height: 24px;
    font-size: 14px; line-height: 1.3;
  }
  #printHelp li::before {
    content: counter(step); position: absolute; left: 0; top: 0;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--bulb); color: var(--bulb-ink); font-weight: 800; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  #printHelp b { font-weight: 800; }

  /* ---------- Result ---------- */
  #result { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; gap: 64px; flex-wrap: wrap; }
  #resultImg {
    height: calc(min(calc(100dvh - 40px - var(--header-h)), 90vw * 1.48) * .9);   /* preview shown 10% smaller; the saved/printed image is unchanged */
    aspect-ratio: 100 / 148;
    border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
    -webkit-user-select: auto; user-select: auto;
    -webkit-touch-callout: default;
  }
  #resultSide { display: flex; flex-direction: column; gap: 12px; align-items: stretch; min-width: 220px; }
  #againBtn { margin-top: 38px; }   /* with the 12px gap = one button's height of space above Take New Photos */
  @media (max-aspect-ratio: 1/1) {
    #result { flex-direction: column; gap: 32px; }
    #againBtn { margin-top: 0; }
    #resultImg { height: calc(min(calc((100dvh - var(--header-h)) * .65), 90vw * 1.48) * .9); }
    #resultSide { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>

<header id="header"><img id="headerImg" src="icons/header.png" alt="Ian and Marissa’s Photo Booth"></header>

<div id="app">
  <!-- Booth -->
  <div id="booth" style="display:contents">
    <div id="stageArea">
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <img id="freeze" class="hidden" alt="">
      <div id="countdown"></div>
      <div id="flash"></div>
      <div id="status" class="hidden"></div>
      <div id="message">Starting camera…<br>Tap <b>Allow</b> when Safari asks for access.</div>
    </div>
    </div>
    <div id="controlsWrap">
    <div id="controls">
      <div class="row">
        <div class="opt" id="layoutSeg" role="group" aria-label="Photos">
          <span class="optLabel">Photos</span>
          <span class="optDiv" aria-hidden="true"></span>
          <button data-n="3">3</button>
          <button data-n="4">4</button>
        </div>
        <div class="opt" id="timeSeg" role="group" aria-label="Time Between Photos">
          <span class="optLabel">Time Between Photos</span>
          <span class="optDiv" aria-hidden="true"></span>
          <button data-t="3">3 Seconds</button>
          <button data-t="5">5 Seconds</button>
          <button data-t="10">10 Seconds</button>
        </div>
        <div class="opt" id="modeSeg" role="group" aria-label="Mode">
          <span class="optLabel">Mode</span>
          <span class="optDiv" aria-hidden="true"></span>
          <button data-m="color">Color</button>
          <button data-m="bw">B&amp;W</button>
        </div>
      </div>
      <div class="row">
        <button id="flip" class="secondary" aria-label="Flip camera" title="Flip camera"><img src="icons/flip.png" alt=""></button>
        <button id="frameBtn" class="secondary hidden">Frame</button>
        <button id="start" disabled>Take Photos</button>
      </div>
    </div>
    <div id="controlsCover"><button id="cancelBtn">Cancel</button></div>
    </div>
  </div>

  <!-- Result -->
  <div id="result" class="hidden">
    <img id="resultImg" alt="Your photo strips">
    <div id="resultSide">
      <button id="printBtn">Print</button>
      <button id="resultFrameBtn" class="secondary hidden">Change Frame</button>
      <button id="resultFilterBtn" class="secondary">Toggle B&amp;W</button>
      <button id="shareBtn" class="secondary">Save / Share</button>
      <a id="downloadLink" class="hidden" download="photobooth-strip.jpg"></a>
      <button id="againBtn">Take New Photos</button>
    </div>
    <div id="printHelp" class="hidden" aria-live="polite">
      <h3>To Print</h3>
      <ol>
        <li>Tap <b>Print</b> in the menu</li>
        <li>Select <b>Canon SELPHY CP1500</b> as the printer</li>
        <li>Choose the <b>number of copies</b> (each copy is 2 strips)</li>
        <li>Tap the <b>print icon</b> in the top right</li>
      </ol>
    </div>
  </div>
</div>

<!-- Frame chooser -->
<div id="frameModal" class="hidden" role="dialog" aria-modal="true" aria-label="Choose a frame">
  <div id="framePanel">
    <h2>Choose a frame</h2>
    <div id="frameList"></div>
    <button id="frameClose" class="secondary">Close</button>
  </div>
</div>

<script>
(() => {
  // ---------- Settings ----------
  const DEFAULT_COUNT = 5;     // which Time Between Photos button starts selected (3, 5 or 10); the countdown always follows the selected button
  const REVIEW_MS    = 3000;   // how long each new photo stays frozen on screen
  const CAPTION_TEXT = '';     // optional text under the photos on each strip (built-in black frame only)
  const DEFAULT_SHOTS = 4;     // 3 or 4 photos per strip when the page first opens

  // Paper used for the Print button's PDF. The whole sheet is built at this paper's exact shape.
  //   'selphy' = Canon SELPHY postcard paper, 100 x 148 mm (iOS lists it as "Postcard")
  //   '4x6'    = true 4 x 6 in, 101.6 x 152.4 mm (most other photo printers)
  const PRINT_PAPER = 'selphy';
  const PAPERS = { selphy: { w: 100, h: 148 }, '4x6': { w: 101.6, h: 152.4 } };

  // ---------- Sheet + strip geometry ----------
  // The sheet holds two identical strips side by side. Each strip is half the paper wide and
  // the full paper tall: 50 x 148 mm on SELPHY paper.
  const PAPER   = PAPERS[PRINT_PAPER] || PAPERS['4x6'];
  const SHEET_W = 1200;                                         // px
  const SHEET_H = Math.round(SHEET_W * PAPER.h / PAPER.w);      // 1776 (SELPHY) or 1800 (4x6)
  const STRIP_W = SHEET_W / 2;                                  // 600
  const STRIP_H = SHEET_H;

  // Photo windows for each layout, in strip pixels (600 wide), modelled on the reference strips.
  //   3 photos: 520x425 photos (same left/right/top margins as 4 photos), big empty area underneath for a caption/logo
  //   4 photos: 520x347 (3:2) photos with a smaller area underneath
  const stack = (n, x, top, w, h, gap) =>
    Array.from({ length: n }, (_, i) => ({ x, y: top + i * (h + gap), w, h }));
  const LAYOUTS = {
    3: stack(3, 40,  60, 520, 425, 24),
    4: stack(4, 40,  60, 520, 347, 24),
  };

  const CAPTURE_W = 1080;   // stored photo width; its height follows the photo window's shape (same as the live preview)

  // ---------- Frames ----------
  // Custom frames are images stored in the repo, one per layout (3 and 4 photos), because the
  // photo windows are in different places. Make each image 600 x 1776 px (or 600 x 1800 if you
  // set PRINT_PAPER to '4x6'). It is the size of ONE strip.
  //   • .png → drawn ON TOP of the photos, so leave the photo windows transparent.
  //   • .jpg → drawn BEHIND the photos, which sit in the windows listed in LAYOUTS above.
  // Give a frame just one of the two files and it only appears for that layout.
  // Optional per-frame settings:
  //   overlay: true/false – override the png/jpg rule above
  //   slots:   { 3: [{x,y,w,h},…3], 4: [{x,y,w,h},…4] } – your own photo windows
  // A file that can't be loaded is skipped automatically.
  // Plain-colour frames need no files: give an entry bg (the colour), and optionally fg (caption text
  // colour) and guide (the faint cut line between the two strips), like Classic Black / Classic White.
  const FRAME_CONFIG = [
    { id: 'black',  name: 'Classic Black', bg: '#141414', fg: '#F2F0EF', guide: '#2a2a2a' },   // built in, no file needed
    { id: 'white',  name: 'Classic White', bg: '#F2F0EF', fg: '#141414', guide: '#d8d5d3' },   // built in, no file needed
    { id: 'pixel',   name: 'Halloween Pixel', files: { 3: 'frames/pixel-3.png', 4:'frames/pixel-4.png'}},
    { id: 'web', name: 'Halloween Web', files: { 3: 'frames/web-3.png', 4:'frames/web-4.png'}},
    // { id: 'party', name: 'Party', files: { 3: 'frames/party-3.png', 4: 'frames/party-4.png' } },
  ];

  // ---------- Elements ----------
  const $ = id => document.getElementById(id);
  const video = $('video'), startBtn = $('start'), flipBtn = $('flip');
  const countdownEl = $('countdown'), flashEl = $('flash'), statusEl = $('status'), messageEl = $('message');
  const segBtns = [...document.querySelectorAll('#layoutSeg button')];
  const timeBtns = [...document.querySelectorAll('#timeSeg button')];
  const modeBtns = [...document.querySelectorAll('#modeSeg button')];
  const booth = $('booth'), result = $('result');
  const resultImg = $('resultImg'), freezeEl = $('freeze');
  const frameBtn = $('frameBtn'), resultFrameBtn = $('resultFrameBtn');
  const frameModal = $('frameModal'), frameList = $('frameList');

  let stream = null, facing = 'user', busy = false;
  let shots = DEFAULT_SHOTS, countSecs = DEFAULT_COUNT, mode = 'color';   // mode: 'color' or 'bw'
  let frames = [FRAME_CONFIG[0]], selected = frames[0];
  let lastPhotos = null, sessionPhotos = null, resultBW = false, renderId = 0;   // lastPhotos are always color; resultBW applies the B&W filter
  let finalBlob = null, finalUrl = null, pdfFile = null, pdfUrl = null;   // finalBlob = the 2-strip sheet shown + printed
  let stripBlob = null, stripUrl = null;                                   // a single strip, used by Save / Share

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };

  // ---------- Camera ----------
  async function startCamera() {
    stopCamera();
    startBtn.disabled = true;
    messageEl.classList.remove('hidden');
    messageEl.innerHTML = 'Starting camera…<br>Tap <b>Allow</b> when Safari asks for access.';

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      messageEl.innerHTML = 'This browser can’t access the camera.<br>Open this page in <b>Safari</b> over <b>https://</b>.';
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      video.srcObject = stream;
      video.classList.toggle('mirror', facing === 'user');
      await video.play();
      messageEl.classList.add('hidden');
      startBtn.disabled = false;
    } catch (err) {
      console.error(err);
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      messageEl.innerHTML = denied
        ? 'Camera access is blocked.<br>Go to <b>Settings › Safari › Camera</b>, choose <b>Ask</b> or <b>Allow</b>, then reload this page.'
        : 'Couldn’t start the camera.<br>' + (err && err.message ? err.message : 'Please reload and try again.');
    }
  }
  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  // ---------- Capture ----------
  // Grab the current video frame, center-cropped to 4:3, mirrored if front camera.
  function grabFrame() {
    const vw = video.videoWidth, vh = video.videoHeight;
    // Crop the camera image exactly as the live preview does (same shape as the photo window),
    // so what you see during the countdown is what ends up on the strip.
    const target = previewAspect();
    const CAPTURE_H = Math.round(CAPTURE_W / target);
    let sx = 0, sy = 0, sw = vw, sh = vh;
    if (vw / vh > target) { sw = vh * target; sx = (vw - sw) / 2; }
    else                  { sh = vw / target; sy = (vh - sh) / 2; }

    const c = document.createElement('canvas');
    c.width = CAPTURE_W; c.height = CAPTURE_H;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    if (facing === 'user') { ctx.translate(CAPTURE_W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, CAPTURE_W, CAPTURE_H);
    return c;
  }

  async function countdown(n, id) {
    for (let i = n; i >= 1; i--) {
      if (id !== sessionId) return false;
      countdownEl.classList.remove('tick');
      countdownEl.innerHTML = '<span>' + i + '</span>';
      void countdownEl.offsetWidth;            // restart animation
      playTick(i);                             // soft tone at 3, 2, 1
      countdownEl.classList.add('tick');
      await sleep(1000);
      if (id !== sessionId) return false;          // Cancel was pressed
    }
    countdownEl.classList.remove('tick');
    countdownEl.innerHTML = '';
    return true;
  }

  // Sounds are synthesized with Web Audio (no audio files needed). iOS only allows audio after
  // a tap, so the context is created/resumed when "Start photos" is pressed.
  let audioCtx = null;
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
    decodeShutter();
  }

  // Shutter sound file (sounds/shutter.mp3 in the repo). Fetched on page load, decoded once audio is unlocked.
  const SHUTTER_URL = 'sounds/shutter.mp3';
  let shutterData = null, shutterBuf = null, shutterSrc = null;
  fetch(SHUTTER_URL).then(r => r.ok ? r.arrayBuffer() : null)
    .then(b => { shutterData = b; decodeShutter(); })
    .catch(() => console.warn('Shutter sound not found, using built-in sound:', SHUTTER_URL));
  function decodeShutter() {
    if (!audioCtx || !shutterData || shutterBuf) return;
    const data = shutterData; shutterData = null;
    audioCtx.decodeAudioData(data, b => { shutterBuf = b; }, () => console.warn('Could not decode', SHUTTER_URL));
  }
  function tone(type, f0, f1, t, dur, vol, attack = 0.005) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }

  // Plays the shutter file; falls back to a built-in synthesized sound if the file isn't available.
  function playShutter() {
    if (!audioCtx) return;
    if (!shutterBuf) { playShutterSynth(); return; }
    const src = audioCtx.createBufferSource();
    src.buffer = shutterBuf;
    src.connect(audioCtx.destination);
    src.start();
    shutterSrc = src;
  }

  // Fallback: cartoony flash with a soft "pff" burst, a rising zip, then a sparkly double "ding".
  function playShutterSynth() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    // "pff" of noise
    const n = Math.floor(audioCtx.sampleRate * 0.08);
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
    const ng = audioCtx.createGain(); ng.gain.value = 0.35;
    src.connect(hp); hp.connect(ng); ng.connect(audioCtx.destination); src.start(t);
    // rising zip
    tone('sine', 380, 1500, t, 0.14, 0.28, 0.01);
    tone('triangle', 190, 750, t, 0.14, 0.10, 0.01);
    // sparkly ding (two notes)
    tone('sine', 1760, 1760, t + 0.13, 0.28, 0.22);
    tone('sine', 3520, 3520, t + 0.13, 0.16, 0.06);
    tone('sine', 2349, 2349, t + 0.19, 0.34, 0.20);
    tone('sine', 4698, 4698, t + 0.19, 0.18, 0.05);
  }

  // Gentle tone for the last three seconds (3, 2, 1), all the same pitch: C5.
  const TICK_HZ = 523.25;
  function playTick(sec) {
    if (!audioCtx || sec > 3) return;
    const t = audioCtx.currentTime;
    tone('sine', TICK_HZ, TICK_HZ, t, 0.45, 0.16, 0.02);
    tone('sine', TICK_HZ * 2, TICK_HZ * 2, t, 0.3, 0.03, 0.02);
  }

  function flash() {
    flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
  }
  // Clear the class when the fade ends so the animation can't replay when the booth is shown again.
  flashEl.addEventListener('animationend', () => flashEl.classList.remove('go'));

  function setBusy(b) {
    busy = b;
    document.body.classList.toggle('shooting', b);   // fades the Cancel cover in over the buttons
  }

  let sessionId = 0;   // bumped by Cancel; a running session sees the change and quits

  async function runSession() {
    if (busy) return;
    unlockAudio();
    const my = ++sessionId;
    const cancelled = () => my !== sessionId;
    setBusy(true);
    const total = shots;
    statusEl.classList.remove('hidden');

    const photos = [];
    sessionPhotos = photos;                        // so Cancel can wipe them
    for (let i = 0; i < total; i++) {
      statusEl.textContent = 'Photo ' + (i + 1) + ' of ' + total;
      if (!(await countdown(countSecs, my))) return;
      const frame = grabFrame();
      photos.push(frame);
      freezeEl.src = frame.toDataURL('image/jpeg', 0.9);
      freezeEl.classList.toggle('bw', mode === 'bw');
      freezeEl.classList.remove('hidden');   // freeze on the photo just taken
      flash();
      playShutter();
      await sleep(REVIEW_MS);
      if (cancelled()) return;
      freezeEl.classList.add('hidden');
    }
    statusEl.classList.add('hidden');
    lastPhotos = photos;
    resultBW = (mode === 'bw');                    // start with the mode chosen on the main screen
    flashEl.classList.remove('go');
    await renderResult();
    if (cancelled()) return;
    booth.classList.add('hidden');
    result.classList.remove('hidden');
    setBusy(false);
    startBtn.disabled = !stream;
  }

  // Cancel: abort the session and return to the main screen (buttons fade back in).
  function cancelSession() {
    if (!busy) return;
    sessionId++;                                   // makes the running session quit
    if (shutterSrc) { try { shutterSrc.stop(); } catch (e) {} shutterSrc = null; }
    countdownEl.classList.remove('tick'); countdownEl.innerHTML = '';
    flashEl.classList.remove('go');
    freezeEl.classList.add('hidden');
    statusEl.classList.add('hidden');
    wipeResult();                                  // discard photos taken so far
    setBusy(false);
  }
  $('cancelBtn').addEventListener('click', cancelSession);

  // ---------- Photos-per-strip toggle ----------
  function setShots(n) {
    shots = n;
    store.set('photobooth-shots', String(n));
    segBtns.forEach(b => b.classList.toggle('on', Number(b.dataset.n) === n));
    updateFrameUI();
  }
  segBtns.forEach(b => b.addEventListener('click', () => { if (!busy) setShots(Number(b.dataset.n)); }));

  // ---------- Mode: color or black & white ----------
  function setMode(m) {
    mode = m;
    store.set('photobooth-mode', m);
    modeBtns.forEach(b => b.classList.toggle('on', b.dataset.m === m));
    video.classList.toggle('bw', m === 'bw');          // live preview matches the photos
  }
  modeBtns.forEach(b => b.addEventListener('click', () => { if (!busy) setMode(b.dataset.m); }));

  // ---------- Time between photos (countdown length) ----------
  function setCount(t) {
    countSecs = t;
    store.set('photobooth-count', String(t));
    timeBtns.forEach(b => b.classList.toggle('on', Number(b.dataset.t) === t));
  }
  timeBtns.forEach(b => b.addEventListener('click', () => { if (!busy) setCount(Number(b.dataset.t)); }));

  // ---------- Compose ----------
  // Draw photo `img` into box (x,y,w,h) using "cover" cropping.
  function drawCover(ctx, img, x, y, w, h) {
    const iw = img.width, ih = img.height;
    const ar = w / h;
    let sx = 0, sy = 0, sw = iw, sh = ih;
    if (iw / ih > ar) { sw = ih * ar; sx = (iw - sw) / 2; }
    else              { sh = iw / ar; sy = (ih - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  // Frames that can be used with a given photo count.
  const availableFrames = n => frames.filter(f => !f.files || (f.art && f.art[n]));
  // The selected frame, or the built-in black one if it has no art for this layout.
  const frameFor = n => availableFrames(n).includes(selected) ? selected : frames[0];

  // Draw one strip at horizontal offset x0. photos === null draws grey placeholders.
  function drawStrip(ctx, x0, photos, frame, count) {
    const slots = (frame.slots && frame.slots[count]) || LAYOUTS[count];
    const art = frame.art && frame.art[count];
    ctx.fillStyle = frame.bg || '#141414';           // built-in frames set their own colour
    ctx.fillRect(x0, 0, STRIP_W, STRIP_H);
    if (art && !art.overlay) ctx.drawImage(art.img, x0, 0, STRIP_W, STRIP_H);     // background art
    slots.forEach((s, i) => {
      if (photos && photos[i]) drawCover(ctx, photos[i], x0 + s.x, s.y, s.w, s.h);
      else { ctx.fillStyle = '#6b7280'; ctx.fillRect(x0 + s.x, s.y, s.w, s.h); }
    });
    if (art && art.overlay) ctx.drawImage(art.img, x0, 0, STRIP_W, STRIP_H);      // overlay art
    if (!art && CAPTION_TEXT && photos) {
      const last = slots[slots.length - 1];
      const yCap = last.y + last.h + (STRIP_H - last.y - last.h) / 2;
      ctx.fillStyle = frame.fg || '#F2F0EF';
      ctx.font = '600 28px -apple-system, Helvetica, Arial, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(CAPTION_TEXT, x0 + STRIP_W / 2, yCap);
    }
  }

  // Full sheet = two identical strips side by side.
  function composeSheet(photos, frame) {
    const sheet = document.createElement('canvas');
    sheet.width = SHEET_W; sheet.height = SHEET_H;
    const ctx = sheet.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    drawStrip(ctx, 0, photos, frame, photos.length);
    drawStrip(ctx, STRIP_W, photos, frame, photos.length);
    ctx.fillStyle = frame.guide || '#2a2a2a';       // faint cut guide
    ctx.fillRect(STRIP_W - 1, 0, 2, SHEET_H);
    return sheet;
  }

  // ---------- Wiping photos from memory ----------
  const freeCanvases = list => (list || []).forEach(c => { c.width = 0; c.height = 0; });

  // Drops every photo, the finished strip and the print PDF so nothing is kept in memory.
  function wipeResult() {
    renderId++;                                    // cancels any render still in progress
    if (finalUrl) URL.revokeObjectURL(finalUrl);
    if (pdfUrl) URL.revokeObjectURL(pdfUrl);
    if (stripUrl) URL.revokeObjectURL(stripUrl);
    finalUrl = pdfUrl = stripUrl = null; finalBlob = pdfFile = stripBlob = null;
    resultImg.removeAttribute('src');
    $('downloadLink').removeAttribute('href');
    freezeEl.removeAttribute('src');
    freeCanvases(lastPhotos); freeCanvases(sessionPhotos);
    lastPhotos = sessionPhotos = null;
  }

  // Black & white copy of a photo canvas.
  function toGray(src) {
    const c = document.createElement('canvas');
    c.width = src.width; c.height = src.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(src, 0, 0);
    const img = ctx.getImageData(0, 0, c.width, c.height), d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
      d[i] = d[i + 1] = d[i + 2] = g;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }

  // Build the sheet from lastPhotos + the chosen frame, and refresh the image and PDF.
  async function renderResult() {
    const id = ++renderId;
    const photos = resultBW ? lastPhotos.map(toGray) : lastPhotos;
    const frame = frameFor(lastPhotos.length);
    const sheet = composeSheet(photos, frame);
    const blob = await new Promise(res => sheet.toBlob(res, 'image/jpeg', 0.95));
    sheet.width = sheet.height = 0;                // release the temporary canvas
    // one single strip (not two side by side) for Save / Share
    const strip = document.createElement('canvas');
    strip.width = STRIP_W; strip.height = STRIP_H;
    drawStrip(strip.getContext('2d'), 0, photos, frame, photos.length);
    const sBlob = await new Promise(res => strip.toBlob(res, 'image/jpeg', 0.95));
    strip.width = strip.height = 0;
    if (resultBW) freeCanvases(photos);            // release the temporary grayscale copies
    const pdf = new File([await makePdf(blob)], 'photobooth-print.pdf', { type: 'application/pdf' });
    if (id !== renderId) return;                    // a newer render superseded this one

    if (finalUrl) URL.revokeObjectURL(finalUrl);
    if (pdfUrl) URL.revokeObjectURL(pdfUrl);
    if (stripUrl) URL.revokeObjectURL(stripUrl);
    finalBlob = blob; pdfFile = pdf; stripBlob = sBlob;
    finalUrl = URL.createObjectURL(blob);
    pdfUrl = URL.createObjectURL(pdf);
    stripUrl = URL.createObjectURL(sBlob);
    resultImg.src = finalUrl;                      // preview = the 2-strip print sheet
    $('downloadLink').href = stripUrl;             // download fallback = one strip
  }

  // ---------- Print PDF ----------
  // One-page PDF whose page is exactly the chosen paper size. The sheet is built at the same
  // shape, so it fills the page edge to edge with nothing trimmed. iOS prints PDFs at their true
  // page size, with no URL/date footer.
  async function makePdf(jpegBlob) {
    const jpg = new Uint8Array(await jpegBlob.arrayBuffer());
    const pw = PAPER.w / 25.4 * 72, ph = PAPER.h / 25.4 * 72;          // page size in points
    const sc = Math.max(pw / SHEET_W, ph / SHEET_H);                     // "cover" scale
    const iw = SHEET_W * sc, ih = SHEET_H * sc;
    const ix = (pw - iw) / 2, iy = (ph - ih) / 2;
    const f = n => n.toFixed(3);
    const enc = new TextEncoder();
    const chunks = [], offsets = [];
    let len = 0;
    const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; };
    const obj = (n, body) => { offsets[n] = len; push(n + ' 0 obj\n' + body + '\nendobj\n'); };

    push('%PDF-1.4\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + f(pw) + ' ' + f(ph) + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
    offsets[4] = len;
    push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + SHEET_W + ' /Height ' + SHEET_H +
         ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpg.length + ' >>\nstream\n');
    push(jpg);
    push('\nendstream\nendobj\n');
    const content = 'q ' + f(iw) + ' 0 0 ' + f(ih) + ' ' + f(ix) + ' ' + f(iy) + ' cm /Im0 Do Q';
    obj(5, '<< /Length ' + content.length + ' >>\nstream\n' + content + '\nendstream');

    const xrefPos = len;
    let x = 'xref\n0 6\n0000000000 65535 f \n';
    for (let i = 1; i <= 5; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
    push(x + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xrefPos + '\n%%EOF');
    return new Blob(chunks, { type: 'application/pdf' });
  }

  // ---------- Frame picker ----------
  function loadImage(src) {
    return new Promise(res => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => { console.warn('Frame image not found, skipping:', src); res(null); };
      im.src = src;
    });
  }

  async function loadFrames() {
    const list = await Promise.all(FRAME_CONFIG.map(async f => {
      if (!f.files) return f;
      const art = {};
      for (const n of [3, 4]) {
        const src = f.files[n];
        if (!src) continue;
        const img = await loadImage(src);
        if (img) art[n] = { img, overlay: f.overlay !== undefined ? f.overlay : /\.png$/i.test(src.split('?')[0]) };
      }
      return { ...f, art };
    }));
    return list.filter(f => !f.files || Object.keys(f.art).length);
  }

  function makeThumb(frame, count) {
    const c = document.createElement('canvas');
    c.width = 180; c.height = Math.round(180 * STRIP_H / STRIP_W);
    const ctx = c.getContext('2d');
    ctx.scale(180 / STRIP_W, 180 / STRIP_W);
    drawStrip(ctx, 0, null, frame, count);
    return c;
  }

  const currentCount = () => (!result.classList.contains('hidden') && lastPhotos) ? lastPhotos.length : shots;

  // Make the live preview the same shape as the photo windows of the selected frame / layout.
  function previewAspect() {
    const slots = (frameFor(shots).slots && frameFor(shots).slots[shots]) || LAYOUTS[shots];
    return slots[0].w / slots[0].h;
  }
  function applyPreviewAspect() {
    $('stage').style.setProperty('--ar', previewAspect().toFixed(4));
  }

  // Make the Frame button just wide enough for the longest "Frame: <name>" so no name is cut off
  // and the button never changes size.
  function sizeFrameBtn() {
    const cs = getComputedStyle(frameBtn);
    const ctx = document.createElement('canvas').getContext('2d');
    const font = cs.fontSize + ' ' + cs.fontFamily;
    ctx.font = '800 ' + font;                                   // "Frame:" is bold
    const labelW = ctx.measureText('Frame:').width;
    ctx.font = cs.fontWeight + ' ' + font;
    let w = 0;
    frames.forEach(f => { w = Math.max(w, labelW + ctx.measureText(' ' + f.name).width); });
    const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
    frameBtn.style.width = Math.ceil(w + pad + 8) + 'px';
  }

  function updateFrameUI() {
    applyPreviewAspect();
    const multi = availableFrames(shots).length > 1;
    frameBtn.classList.toggle('hidden', !multi);
    frameBtn.textContent = '';
    const lab = document.createElement('b'); lab.textContent = 'Frame:';
    frameBtn.append(lab, ' ' + frameFor(shots).name);
    const rc = lastPhotos ? lastPhotos.length : shots;
    resultFrameBtn.classList.toggle('hidden', availableFrames(rc).length < 2);
  }

  function openFrameModal() {
    const n = currentCount();
    const active = frameFor(n);
    frameList.innerHTML = '';
    availableFrames(n).forEach(f => {
      const b = document.createElement('button');
      b.className = 'frameItem' + (f === active ? ' selected' : '');
      b.appendChild(makeThumb(f, n));
      const label = document.createElement('span');
      label.textContent = f.name;
      b.appendChild(label);
      b.addEventListener('click', () => chooseFrame(f));
      frameList.appendChild(b);
    });
    frameModal.classList.remove('hidden');
  }
  const closeFrameModal = () => frameModal.classList.add('hidden');

  async function chooseFrame(f) {
    selected = f;
    store.set('photobooth-frame', f.id);
    updateFrameUI();
    closeFrameModal();
    if (!result.classList.contains('hidden') && lastPhotos) await renderResult();   // re-frame current photos
  }

  frameBtn.addEventListener('click', openFrameModal);
  resultFrameBtn.addEventListener('click', openFrameModal);
  $('resultFilterBtn').addEventListener('click', async () => {    // switch Color <-> B&W on the finished photos
    if (!lastPhotos) return;
    resultBW = !resultBW;
    await renderResult();
  });
  $('frameClose').addEventListener('click', closeFrameModal);
  frameModal.addEventListener('click', e => { if (e.target === frameModal) closeFrameModal(); });

  // ---------- Result actions ----------
  $('printBtn').addEventListener('click', () => {
    if (!pdfFile) return;
    $('printHelp').classList.remove('hidden');     // instructions stay on the right side of the page
    if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
      navigator.share({ files: [pdfFile], title: 'Photobooth print' }).catch(() => {});  // pick "Print"
    } else {
      window.open(pdfUrl, '_blank');   // PDF viewer, then Share > Print
    }
  });

  $('shareBtn').addEventListener('click', async () => {
    if (!stripBlob) return;
    const file = new File([stripBlob], 'photobooth-strip.jpg', { type: 'image/jpeg' });   // a single strip
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Photobooth' }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    $('downloadLink').click();   // fallback
  });

  $('againBtn').addEventListener('click', () => {
    flashEl.classList.remove('go');
    freezeEl.classList.add('hidden');
    $('printHelp').classList.add('hidden');
    result.classList.add('hidden');
    booth.classList.remove('hidden');
    wipeResult();                                  // finished strip + photos are discarded
    updateFrameUI();
    if (!stream) startCamera(); else startBtn.disabled = false;
  });

  // Leaving, closing or refreshing the page also drops everything. (Nothing is ever written to
  // storage, so the browser frees the memory too; this just makes it explicit.)
  window.addEventListener('pagehide', wipeResult);
  window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });   // restored from back/forward cache: start clean

  // ---------- Header ----------
  const headerEl = $('header');
  const rootStyle = document.documentElement.style;
  const syncHeader = () => {                       // header height including the gap above and below it
    const cs = getComputedStyle(headerEl);
    const h = headerEl.hidden ? 0 : headerEl.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
    rootStyle.setProperty('--header-h', h + 'px');
  };
  const syncControls = () => rootStyle.setProperty('--controls-h', $('controls').offsetHeight + 'px');
  if (window.ResizeObserver) new ResizeObserver(syncControls).observe($('controls'));
  window.addEventListener('resize', syncControls);
  syncControls();
  $('headerImg').addEventListener('error', () => { headerEl.hidden = true; syncHeader(); });   // no image => no header
  if (window.ResizeObserver) new ResizeObserver(syncHeader).observe(headerEl);
  window.addEventListener('resize', syncHeader);
  syncHeader();

  // On the result screen, centre the header vertically between the top of the page and the top of
  // the finished strip. (The camera screen uses the even spacing built into the layout.)
  const headerImg = $('headerImg');
  function placeHeader() {
    if (headerEl.hidden) return;
    const onBooth = !booth.classList.contains('hidden');
    if (onBooth) { headerImg.style.transform = ''; return; }   // camera screen: plain even spacing from the layout itself
    const ref = (onBooth ? $('stage') : resultImg).getBoundingClientRect();
    if (!ref.height) return;
    const frameTop = ref.top - (onBooth ? 6 : 0);                  // 6px = the white outline around the preview
    const h = headerImg.offsetHeight;
    const hb = headerEl.getBoundingClientRect();
    const naturalTop = hb.top + (headerEl.offsetHeight - h) / 2;   // where the image sits without any shift
    const shift = Math.max(0, (frameTop - h) / 2 - naturalTop);
    headerImg.style.transform = 'translateY(' + shift.toFixed(1) + 'px)';
  }
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(placeHeader);
    [headerEl, $('stage'), resultImg, $('app')].forEach(el => ro.observe(el));
  }
  window.addEventListener('resize', placeHeader);
  headerImg.addEventListener('load', placeHeader);
  placeHeader();

  // ---------- No zoom, no scrolling ----------
  // Safari ignores user-scalable=no, so block pinch, double-tap zoom and page panning directly.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
    document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => {
    if (!e.target.closest || !e.target.closest('#frameList')) e.preventDefault();   // frame list may scroll sideways
  }, { passive: false });
  document.addEventListener('wheel', e => { if (e.ctrlKey || !e.target.closest('#frameList')) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (e.target.tagName !== 'IMG') e.preventDefault(); });

  // ---------- Wiring ----------
  startBtn.addEventListener('click', runSession);
  flipBtn.addEventListener('click', () => {
    facing = facing === 'user' ? 'environment' : 'user';
    startCamera();
  });

  // Restart the camera if Safari paused it while the tab was in the background
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !busy && !booth.classList.contains('hidden')) {
      const live = stream && stream.getVideoTracks().some(t => t.readyState === 'live');
      if (!live) startCamera();
    }
  });

  const savedShots = Number(store.get('photobooth-shots'));
  setShots(savedShots === 3 || savedShots === 4 ? savedShots : DEFAULT_SHOTS);
  const savedCount = Number(store.get('photobooth-count'));
  setCount([3, 5, 10].includes(savedCount) ? savedCount : DEFAULT_COUNT);
  setMode(store.get('photobooth-mode') === 'bw' ? 'bw' : 'color');
  startCamera();
  loadFrames().then(list => {
    frames = list;
    selected = frames.find(f => f.id === store.get('photobooth-frame')) || frames[0];
    updateFrameUI();
    sizeFrameBtn();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(sizeFrameBtn);   // re-measure once the web font is in
  });
})();
</script>
</body>
</html>
